[project]
name = "kling"
version = "0.1.0"
description = "Kling Dify-parity tools through Ace Data Cloud for ComfyUI"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3", "jsonschema>=4,<5"]
classifiers = ["Operating System :: OS Independent"]

[project.urls]
Repository = "https://github.com/AceDataCloud/KlingComfyUI"
Documentation = "https://github.com/AceDataCloud/KlingComfyUI#readme"
"Bug Tracker" = "https://github.com/AceDataCloud/KlingComfyUI/issues"

[tool.comfy]
PublisherId = "acedatacloud"
DisplayName = "Kling by Ace Data Cloud"
Icon = "https://raw.githubusercontent.com/AceDataCloud/KlingComfyUI/main/assets/logo-400.png"
